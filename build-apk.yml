name: Android APK bauen
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'PDF-viewe-Android-Quellcode.zip'
      - '.github/workflows/build-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3
      - name: Android SDK 35 installieren
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Quellcode entpacken
        run: |
          mkdir -p android-project
          unzip -q PDF-viewe-Android-Quellcode.zip -d android-project
          test -f android-project/app/build.gradle
      - name: Android Debug-APK bauen
        run: gradle --no-daemon --project-dir android-project assembleDebug
      - name: APK zum Herunterladen bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-viewe-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
